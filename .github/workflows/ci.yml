# .github/workflows/ci.yml
#
# Main CI pipeline for symulator.
#
# Jobs:
#   build-and-test          — compiles the headless server, runs all unit
#                              tests, then runs the integration test suite
#                              against an ephemeral PostgreSQL 16 container.
#                              No Qt involved — vcpkg triplet stays static.
#   build-and-test-qt-ubuntu — compiles client/editor/libtrackview/tools with
#                              Qt6 dynamically linked (LGPLv3 compliance —
#                              see THIRD_PARTY_NOTICES.md) and runs the Qt
#                              test suites.
#   build-and-test-qt-windows — same as above on windows-latest, since the
#                              dynamic-Qt triplet switch only changes
#                              Linux/macOS behavior and this is the only way
#                              to catch a Windows-specific regression in CI.
#
# The build uses vcpkg (classic mode) with a GitHub Actions cache for binary
# packages — first run compiles from source, subsequent runs restore
# pre-built archives and the install step takes only a few seconds. Cache
# keys include a profile tag (headless/qt) since the headless job's static
# triplet and the Qt jobs' dynamic triplet produce incompatible artifacts
# under the same runner.os.
#
# Triggers:
#   push / pull_request → main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (headless, PostgreSQL)
    runs-on: ubuntu-24.04

    # ── Ephemeral PostgreSQL for integration tests ────────────────────────────
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     symulator
          POSTGRES_PASSWORD: symulator_test_pass
          POSTGRES_DB:       symulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symulator -d symulator"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ── System tools ─────────────────────────────────────────────────────────
      # ubuntu-24.04 runners already have gcc/g++/python3.
      # We add only what the vcpkg ports and CMake configure step actually need.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            curl zip unzip tar \
            postgresql-client

      # ── vcpkg bootstrap ───────────────────────────────────────────────────────
      - name: Bootstrap vcpkg
        run: bash 3rdParty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # ── vcpkg binary-package cache ─────────────────────────────────────────
      # Key includes OS and vcpkg.json hash (which embeds the builtin-baseline).
      # Cache hit: vcpkg install extracts pre-built zips in seconds.
      # Cache miss: vcpkg compiles from source and populates the cache.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: 3rdParty/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-headless-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-headless-

      # ── Configure (installs vcpkg deps + cmake configure) ─────────────────
      - name: Configure (headless, without Qt)
        env:
          VCPKG_DISABLE_METRICS: "1"
        run: |
          python3 scripts/configure_ninja.py \
            --headless \
            --without-qt \
            --configure-only

      # ── Proto schema sync validation ─────────────────────────────────────
      - name: Validate FlatBuffers schemas
        run: cmake --build build/ninja-debug-headless --target validate_proto_schemas

      # ── Download data packages ────────────────────────────────────────────
      - name: Fetch data packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_packages.py

      # ── UID registry validation ───────────────────────────────────────────
      - name: Validate UID registry
        run: cmake --build build/ninja-debug-headless --target validate_uid_registry

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build/ninja-debug-headless --parallel $(nproc)

      # ── Grouped tests (no DB required) ────────────────────────────────────
      - name: Grouped tests (pre-DB)
        run: |
          python3 scripts/run_grouped_ctest.py \
            --test-dir build/ninja-debug-headless \
            --reports-dir build/ninja-debug-headless/test-reports \
            --profile pre-db

      # ── Apply DB schema ───────────────────────────────────────────────────
      # The postgres service starts with an empty database; we apply init.sql
      # to create the session schema and all tables before integration tests.
      - name: Apply database schema
        env:
          PGPASSWORD: symulator_test_pass
        run: |
          psql -h localhost -U symulator -d symulator -f docker/init.sql

      # ── Grouped tests (DB required) ───────────────────────────────────────
      - name: Grouped tests (DB)
        env:
          SYMULATOR_TEST_DB: >-
            host=localhost port=5432
            dbname=symulator
            user=symulator
            password=symulator_test_pass
        run: |
          python3 scripts/run_grouped_ctest.py \
            --test-dir build/ninja-debug-headless \
            --reports-dir build/ninja-debug-headless/test-reports \
            --profile db

      # ── Test artifacts ────────────────────────────────────────────────────
      - name: Upload grouped JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-ctest-junit
          path: build/ninja-debug-headless/test-reports/*.xml
          if-no-files-found: warn

  build-and-test-qt-ubuntu:
    name: Build & Test (Qt, dynamic linking, Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ── System tools + Qt6 build dependencies (X11/xcb/EGL headers) ──────────
      - name: Install system dependencies
        run: bash scripts/deps/install_linux.sh

      # ── vcpkg bootstrap ───────────────────────────────────────────────────────
      - name: Bootstrap vcpkg
        run: bash 3rdParty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # ── vcpkg binary-package cache ─────────────────────────────────────────
      # Separate "qt" cache key: this job uses the x64-linux-dynamic triplet
      # (LGPLv3-compliant Qt linking, see THIRD_PARTY_NOTICES.md), whose
      # binaries are incompatible with the headless job's static x64-linux
      # cache entries.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: 3rdParty/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-qt-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-qt-

      # ── Configure (client/editor/libtrackview/tools, dynamic Qt) ──────────
      - name: Configure (Qt, dynamic linking, tools)
        env:
          VCPKG_DISABLE_METRICS: "1"
        run: |
          python3 scripts/configure_ninja.py \
            --build-tools \
            --configure-only

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build/ninja-debug --parallel $(nproc)

      # ── Qt test suites ────────────────────────────────────────────────────
      - name: Qt test suites
        run: |
          python3 scripts/run_grouped_ctest.py \
            --test-dir build/ninja-debug \
            --reports-dir build/ninja-debug/test-reports \
            --profile qt

      # ── Test artifacts ────────────────────────────────────────────────────
      - name: Upload grouped JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-ctest-junit-qt-ubuntu
          path: build/ninja-debug/test-reports/*.xml
          if-no-files-found: warn

  build-and-test-qt-windows:
    name: Build & Test (Qt, dynamic linking, Windows)
    runs-on: windows-latest

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ── MSVC developer environment (cl.exe, link.exe on PATH) ────────────────
      # windows-latest already ships Git/CMake/Ninja/Python/VS2022 Build Tools,
      # so unlike the Linux job we don't reuse scripts/deps/install_windows.ps1
      # (that script is for a bare dev machine and would reinstall all of it).
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # ── vcpkg bootstrap ───────────────────────────────────────────────────────
      - name: Bootstrap vcpkg
        run: .\3rdParty\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      # ── vcpkg binary-package cache ─────────────────────────────────────────
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: 3rdParty/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-qt-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-qt-

      # ── Configure (client/editor/libtrackview/tools, dynamic Qt) ──────────
      # x64-windows is dynamic by default already — no triplet override needed.
      - name: Configure (Qt, dynamic linking, tools)
        env:
          VCPKG_DISABLE_METRICS: "1"
        run: |
          python scripts/configure_ninja.py --build-tools --configure-only

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build/ninja-debug --parallel

      # ── Diagnose Qt platform plugins ──────────────────────────────────────
      # tests_libtrackview / tools_test_editor_persistence (the only two Qt
      # tests that construct QApplication instead of QCoreApplication) hang
      # until ctest's TIMEOUT with zero output, even with unbuffered stdout
      # and QT_DEBUG_PLUGINS=1 — consistent with Qt being unable to find any
      # platform plugin and blocking on a native "failed to start" message
      # box that nothing on a headless runner can dismiss. Cross-check the
      # "Configure" step's logged QT6_INSTALL_PLUGINS path against what's
      # actually on disk before running the (currently timing-out) tests.
      - name: Diagnose Qt platform plugins (Windows)
        run: |
          Get-ChildItem -Recurse -Filter "*offscreen*" -Path 3rdParty/vcpkg/installed | Select-Object FullName
        shell: pwsh

      # ── Qt test suites ────────────────────────────────────────────────────
      - name: Qt test suites
        run: |
          python scripts/run_grouped_ctest.py --test-dir build/ninja-debug --reports-dir build/ninja-debug/test-reports --profile qt

      # ── Test artifacts ────────────────────────────────────────────────────
      - name: Upload grouped JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-ctest-junit-qt-windows
          path: build/ninja-debug/test-reports/*.xml
          if-no-files-found: warn
