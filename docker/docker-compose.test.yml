# docker/docker-compose.test.yml
# Ephemeral PostgreSQL for running integration tests locally or in CI.
#
# Usage:
#   ./scripts/run_integration_tests.sh
#
# The database is stored on tmpfs (no persistent volume) so every `up` starts
# with a clean schema.  Uses port 5433 to avoid clashing with a running
# production instance on the default 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: symulator-test-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-symulator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symulator_test_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-symulator}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
